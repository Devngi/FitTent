<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/favicon.png" />
  <title>FitTent – Sign In</title>
  <meta name="description" content="Sign in to FitTent — your personal health command centre." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #0d9488;
      --accent:  #14b8a6;
      --input-bg: rgba(255,255,255,0.07);
      --border:   rgba(255,255,255,0.1);
      --text:     #e2e8f0;
      --muted:    rgba(148,163,184,0.9);
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }

    /* ── LAYOUT: two equal panels ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
    }

    /* ── LEFT PANEL ── */
    .panel-left {
      background: linear-gradient(145deg, #0a1628 0%, #0d2137 40%, #062524 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      overflow: hidden;
    }

    /* mesh orbs */
    .panel-left::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(13,148,136,.28) 0%, transparent 65%);
      top: -150px; left: -100px;
      border-radius: 50%;
      animation: orb1 14s ease-in-out infinite;
    }
    .panel-left::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,.18) 0%, transparent 65%);
      bottom: -100px; right: -80px;
      border-radius: 50%;
      animation: orb2 16s ease-in-out infinite;
    }
    @keyframes orb1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,30px)} }
    @keyframes orb2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-30px,-20px)} }

    /* grid lines overlay */
    .grid-lines {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .left-content {
      position: relative; z-index: 1;
      text-align: center;
      animation: fadeUp .9s cubic-bezier(.22,1,.36,1) both;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 2.5rem;
    }
    .brand-mark img {
      width: 52px; height: 52px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 8px 32px rgba(13,148,136,.45);
    }
    .brand-mark-name {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
    }

    .left-divider {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 2px;
      margin: 0 auto 1.8rem;
    }

    .left-quote {
      font-size: 1.35rem;
      font-weight: 300;
      color: rgba(255,255,255,.88);
      line-height: 1.55;
      letter-spacing: -0.3px;
      max-width: 360px;
      font-style: italic;
    }
    .left-quote-author {
      margin-top: 1rem;
      font-size: .82rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* floating rings */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(13,148,136,.15);
      pointer-events: none;
    }
    .ring-1 { width: 240px; height: 240px; top: 10%; left: 5%; animation: spin 28s linear infinite; }
    .ring-2 { width: 160px; height: 160px; bottom: 15%; right: 8%; animation: spin 20s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RIGHT PANEL ── */
    .panel-right {
      background: #f8faff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-y: auto;
    }

    .form-wrap {
      width: 100%;
      max-width: 400px;
      animation: fadeUp .75s cubic-bezier(.22,1,.36,1) .1s both;
    }

    .form-heading {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.5px;
      margin-bottom: .4rem;
    }
    .form-subheading {
      font-size: .88rem;
      color: #64748b;
      margin-bottom: 1.8rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: .65rem;
      padding: 3px;
      margin-bottom: 1.6rem;
      border: 1px solid #e2e8f0;
    }
    .tab {
      flex: 1; text-align: center;
      padding: .52rem;
      border-radius: .48rem;
      font-size: .85rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all .22s;
      user-select: none;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      box-shadow: 0 2px 12px rgba(13,148,136,.3);
    }

    /* Alert */
    .alert {
      border-radius: .55rem;
      padding: .65rem .9rem;
      font-size: .82rem;
      font-weight: 500;
      margin-bottom: 1rem;
      display: none;
    }
    .alert.error   { background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.25);  color: #dc2626; }
    .alert.success { background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.25); color: #059669; }

    /* Fields */
    .field { margin-bottom: .85rem; }
    .field label {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: .3rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: .55rem;
      padding: .72rem 1rem;
      font-size: .9rem;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
      transition: border-color .2s, box-shadow .2s;
    }
    .field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13,148,136,.14);
    }
    .field input::placeholder { color: #cbd5e1; }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 2.8rem; }
    .pw-toggle {
      position: absolute; right: .85rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: #94a3b8; cursor: pointer;
      font-size: .85rem; padding: 0; line-height: 1;
    }
    .pw-toggle:hover { color: var(--primary); }

    /* strength meter */
    .pw-meter { margin-top: .4rem; display: none; }
    .pw-bar   { height: 3px; border-radius: 2px; background: #e2e8f0; overflow: hidden; }
    .pw-fill  { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0%; }
    .pw-lbl   { font-size: .7rem; color: #94a3b8; margin-top: 3px; }

    /* CTA */
    .btn-cta {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none; border-radius: .6rem;
      color: #fff; font-weight: 700; font-size: .92rem;
      padding: .82rem;
      cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(13,148,136,.28);
      font-family: 'Inter', sans-serif;
      margin-top: .2rem;
    }
    .btn-cta:hover  { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(13,148,136,.36); }
    .btn-cta:active { transform: translateY(0); }
    .btn-cta:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: .7rem;
      margin: 1.1rem 0;
      color: #94a3b8; font-size: .75rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1;
      height: 1px; background: #e2e8f0;
    }

    /* Google button */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: .65rem;
      width: 100%;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: .6rem;
      color: #374151;
      font-size: .88rem; font-weight: 600;
      padding: .72rem;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .btn-google:hover {
      border-color: #4285F4;
      box-shadow: 0 2px 14px rgba(66,133,244,.18);
      color: #111827;
      transform: translateY(-1px);
    }
    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Footer */
    .card-footer {
      text-align: center;
      margin-top: 1.4rem;
      font-size: .73rem;
      color: #94a3b8;
    }
    .card-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .card-footer a:hover { text-decoration: underline; }

    /* Spinner */
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .65s linear infinite;
      display: inline-block; vertical-align: middle;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive: stack on mobile */
    @media (max-width: 768px) {
      html, body { overflow: auto; }
      .layout { grid-template-columns: 1fr; height: auto; }
      .panel-left { min-height: 220px; padding: 2rem 1.5rem; }
      .panel-right { padding: 2rem 1.5rem; }
      .ring { display: none; }
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- ─────────────── LEFT PANEL ─────────────── -->
  <div class="panel-left">
    <div class="grid-lines"></div>
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>

    <div class="left-content">
      <div class="brand-mark">
        <img src="assets/logo.jpg" alt="FitTent" />
        <span class="brand-mark-name">FitTent</span>
      </div>

      <div class="left-divider"></div>

      <p class="left-quote">
        "The groundwork for all happiness is good health."
      </p>
      <div class="left-quote-author">— Leigh Hunt</div>
    </div>
  </div>

  <!-- ─────────────── RIGHT PANEL ─────────────── -->
  <div class="panel-right">
    <div class="form-wrap">

      <div class="form-heading">Welcome back</div>
      <div class="form-subheading">Sign in to your FitTent account to continue.</div>

      <!-- Tabs -->
      <div class="tabs">
        <div class="tab active" id="tab-login"  onclick="switchTab('login')">Sign In</div>
        <div class="tab"        id="tab-signup" onclick="switchTab('signup')">Create Account</div>
      </div>

      <!-- Alert -->
      <div class="alert" id="authAlert"></div>

      <!-- ── SIGN IN ── -->
      <div id="form-login">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="pw-wrap">
            <input id="login-password" type="password" placeholder="Enter your password" autocomplete="current-password" />
            <button class="pw-toggle" type="button" onclick="togglePw('login-password',this)" aria-label="Show password">&#9679;&#9679;&#9679;</button>
          </div>
        </div>
        <button class="btn-cta" id="btn-login" onclick="doLogin()">Sign In</button>
        <div class="divider">or continue with</div>
        <a href="/api/auth/google" id="btn-google-login" class="btn-google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </a>
      </div>

      <!-- ── CREATE ACCOUNT ── -->
      <div id="form-signup" style="display:none;">
        <div class="field">
          <label for="signup-name">Full Name</label>
          <input id="signup-name" type="text" placeholder="e.g. Alex Kumar" autocomplete="name" />
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <div class="pw-wrap">
            <input id="signup-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)" />
            <button class="pw-toggle" type="button" onclick="togglePw('signup-password',this)" aria-label="Show password">&#9679;&#9679;&#9679;</button>
          </div>
          <div class="pw-meter" id="pwMeter">
            <div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div>
            <div class="pw-lbl" id="pwLbl">Weak</div>
          </div>
        </div>
        <div class="field">
          <label for="signup-confirm">Confirm Password</label>
          <div class="pw-wrap">
            <input id="signup-confirm" type="password" placeholder="Repeat password" autocomplete="new-password" />
            <button class="pw-toggle" type="button" onclick="togglePw('signup-confirm',this)" aria-label="Show password">&#9679;&#9679;&#9679;</button>
          </div>
        </div>
        <button class="btn-cta" id="btn-signup" onclick="doSignup()">Create Account</button>
        <div class="divider">or sign up with</div>
        <a href="/api/auth/google" id="btn-google-signup" class="btn-google">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Sign up with Google
        </a>
      </div>

      <div class="card-footer">
        By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>.
      </div>
    </div>
  </div>

</div>

<script>
'use strict';
const API = 'http://127.0.0.1:5002/api';

/* Show URL error/msg */
(function(){
  const p = new URLSearchParams(window.location.search);
  if (p.get('error')) showAlert('error',   decodeURIComponent(p.get('error')));
  if (p.get('msg'))   showAlert('success',  decodeURIComponent(p.get('msg')));
})();

function switchTab(t) {
  document.getElementById('tab-login').classList.toggle('active',  t === 'login');
  document.getElementById('tab-signup').classList.toggle('active', t === 'signup');
  document.getElementById('form-login').style.display  = t === 'login'  ? 'block' : 'none';
  document.getElementById('form-signup').style.display = t === 'signup' ? 'block' : 'none';
  const h = document.querySelector('.form-heading');
  const s = document.querySelector('.form-subheading');
  if (t === 'login') {
    h.textContent = 'Welcome back';
    s.textContent = 'Sign in to your FitTent account to continue.';
  } else {
    h.textContent = 'Create account';
    s.textContent = 'Join FitTent and start tracking your health today.';
  }
  hideAlert();
}

function showAlert(type, msg) {
  const el = document.getElementById('authAlert');
  el.className = 'alert ' + type;
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAlert() { document.getElementById('authAlert').style.display = 'none'; }

function togglePw(id, btn) {
  const i = document.getElementById(id);
  i.type = i.type === 'password' ? 'text' : 'password';
  btn.textContent = i.type === 'text' ? 'Hide' : '\u25CF\u25CF\u25CF';
}

function checkStrength(pw) {
  const meter = document.getElementById('pwMeter');
  const fill  = document.getElementById('pwFill');
  const lbl   = document.getElementById('pwLbl');
  meter.style.display = pw.length ? 'block' : 'none';
  let s = 0;
  if (pw.length >= 8)           s++;
  if (/[A-Z]/.test(pw))        s++;
  if (/[0-9]/.test(pw))        s++;
  if (/[^A-Za-z0-9]/.test(pw)) s++;
  const lvls = [
    { label: 'Very Weak', color: '#ef4444', pct: '15%' },
    { label: 'Weak',      color: '#f97316', pct: '35%' },
    { label: 'Fair',      color: '#eab308', pct: '60%' },
    { label: 'Strong',    color: '#22c55e', pct: '80%' },
    { label: 'Very Strong', color: '#0d9488', pct: '100%' },
  ];
  const lv = lvls[s] || lvls[0];
  fill.style.width      = lv.pct;
  fill.style.background = lv.color;
  lbl.textContent       = lv.label;
  lbl.style.color       = lv.color;
}

function setLoading(id, on, text) {
  const b = document.getElementById(id);
  if (on) { b.disabled = true; b.innerHTML = '<span class="spinner"></span>&nbsp; Please wait…'; }
  else    { b.disabled = false; b.textContent = text; }
}

async function doLogin() {
  hideAlert();
  const email = document.getElementById('login-email').value.trim();
  const pw    = document.getElementById('login-password').value;
  if (!email || !pw) return showAlert('error', 'Please fill in your email and password.');
  setLoading('btn-login', true, 'Sign In');
  try {
    const r = await fetch(API + '/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Login failed');
    showAlert('success', 'Welcome back! Redirecting…');
    setTimeout(() => { window.location.href = '/'; }, 700);
  } catch(e) {
    showAlert('error', e.message);
    setLoading('btn-login', false, 'Sign In');
  }
}

async function doSignup() {
  hideAlert();
  const name    = document.getElementById('signup-name').value.trim();
  const email   = document.getElementById('signup-email').value.trim();
  const pw      = document.getElementById('signup-password').value;
  const confirm = document.getElementById('signup-confirm').value;
  if (!email || !pw)  return showAlert('error', 'Email and password are required.');
  if (pw.length < 8)  return showAlert('error', 'Password must be at least 8 characters.');
  if (pw !== confirm) return showAlert('error', 'Passwords do not match.');
  setLoading('btn-signup', true, 'Create Account');
  try {
    const r = await fetch(API + '/auth/register', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw, name }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Registration failed');
    showAlert('success', 'Account created! Redirecting…');
    setTimeout(() => { window.location.href = '/'; }, 700);
  } catch(e) {
    showAlert('error', e.message);
    setLoading('btn-signup', false, 'Create Account');
  }
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('form-login').style.display !== 'none') doLogin();
  else doSignup();
});
</script>
</body>
</html>
