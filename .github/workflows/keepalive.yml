name: Keep Render App Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FitTent Render URL
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://fittent.onrender.com
